server:
  port: 8083
  error:
    include-message: always

spring:
  profiles:
    active: ${ENV_PROFILE}
  application:
    name: job-management-service

  datasource:
    url: jdbc:mysql://localhost/job_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /api-docs

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  upload:
    dir: ${UPLOAD_DIR:C:/hmbrandt/uploads/signatures/}
  base-url: ${APP_BASE_URL:http://localhost:8080}

services:
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8088}

logging:
  level:
    org.springframework.web.servlet.resource: INFO
    org.springframework.core.io: INFO
